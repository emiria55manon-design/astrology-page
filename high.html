<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合を立体で見る｜Conjunction in Depth</title>
<style>
  :root{
    --ground:#0C1622;
    --ground2:#101E2C;
    --panel:rgba(16,30,44,.86);
    --ink:#E6DCC6;
    --ink-dim:#8C9AA8;
    --gold:#C9AE74;
    --accent:#C2483A;
    --plane:#4E7A96;
    --line:rgba(201,174,116,.22);
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--gothic);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100dvh;min-height:100dvh}

  /* ---------- masthead ---------- */
  header{
    display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;
    padding:.65rem 1rem .55rem;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0F1B28,#0C1622);
  }
  h1{
    font-family:var(--mincho);
    font-size:1.06rem;font-weight:600;letter-spacing:.16em;margin:0;
  }
  .romaji{
    font-family:var(--mono);font-size:.6rem;letter-spacing:.28em;
    color:var(--ink-dim);text-transform:uppercase;
  }
  .scenes{display:flex;gap:.15rem;margin-left:auto;flex-wrap:wrap}
  .scene-tab{
    font-family:var(--mincho);font-size:.78rem;letter-spacing:.08em;
    background:none;border:1px solid transparent;border-radius:2px;
    color:var(--ink-dim);padding:.3rem .6rem;cursor:pointer;
    transition:color .18s,border-color .18s;
  }
  .scene-tab:hover{color:var(--ink)}
  .scene-tab[aria-selected="true"]{color:var(--gold);border-color:var(--line);background:rgba(201,174,116,.06)}

  /* ---------- stage ---------- */
  #stage{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab}
  #stage.dragging{cursor:grabbing}
  canvas{display:block;width:100%;height:100%}

  .plate{
    position:absolute;background:var(--panel);
    border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(6px);pointer-events:none;
    transition:opacity .25s;
  }
  #stage.dragging .plate{opacity:.12}
  #stage.plates-off .plate{opacity:0}
  #caption{
    top:.75rem;left:.75rem;max-width:min(23rem,58vw);padding:.6rem .75rem .65rem;
  }
  #caption .sub{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;color:var(--gold);margin-bottom:.3rem}
  #caption .head{font-family:var(--mincho);font-size:1.02rem;letter-spacing:.06em;margin-bottom:.35rem}
  #caption .note{font-size:.72rem;line-height:1.65;color:var(--ink-dim)}

  #readout{
    right:.75rem;top:.75rem;padding:.55rem .7rem;min-width:11.5rem;
    font-family:var(--mono);font-size:.66rem;letter-spacing:.02em;
  }
  #readout .date{color:var(--gold);font-size:.72rem;margin-bottom:.45rem;letter-spacing:.06em}
  #readout dl{display:grid;grid-template-columns:auto 1fr;gap:.16rem .7rem;margin:0}
  #readout dt{color:var(--ink-dim)}
  #readout dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #readout .rule{grid-column:1/-1;height:1px;background:var(--line);margin:.25rem 0}
  #readout .big{color:var(--accent)}
  #readout .cap{color:#5C6A78;font-size:.9em}

  #verdict{
    left:50%;transform:translateX(-50%);bottom:.75rem;
    padding:.4rem .9rem;font-family:var(--mincho);font-size:.8rem;letter-spacing:.1em;
    transition:opacity .35s;
  }
  #verdict b{color:var(--gold);font-weight:600}

  /* ---------- controls ---------- */
  footer{
    border-top:1px solid var(--line);
    background:#0A131E;
    padding:.5rem .9rem .6rem;
    display:flex;flex-direction:column;gap:.45rem;
  }
  .rail{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  .rail label{
    font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;
    color:var(--ink-dim);white-space:nowrap;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;background:none;height:1.1rem;flex:1;min-width:7rem;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
  input[type=range]::-moz-range-track{height:1px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:.62rem;height:.62rem;margin-top:-.3rem;
    background:var(--gold);border-radius:50%;cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:.62rem;height:.62rem;background:var(--gold);border:0;border-radius:50%;cursor:pointer;
  }
  input[type=range]:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

  .track-wrap{position:relative;flex:1;min-width:8rem}
  .track-wrap input[type=range]{width:100%;display:block}
  .marks{position:relative;height:.8rem}
  .marks button{
    position:absolute;transform:translateX(-50%);
    background:none;border:0;padding:0 .2rem;cursor:pointer;
    font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;
    color:var(--accent);white-space:nowrap;
  }
  .marks button::before{
    content:"";position:absolute;left:50%;top:-.32rem;width:1px;height:.28rem;
    background:var(--accent);
  }
  .marks button:hover{color:var(--ink)}

  button.ctl{
    font-family:var(--gothic);font-size:.7rem;letter-spacing:.06em;
    background:rgba(201,174,116,.07);color:var(--ink);
    border:1px solid var(--line);border-radius:2px;
    padding:.32rem .7rem;cursor:pointer;transition:background .16s,border-color .16s;
  }
  button.ctl:hover{background:rgba(201,174,116,.16);border-color:rgba(201,174,116,.45)}
  button.ctl[aria-pressed="true"]{background:rgba(194,72,58,.18);border-color:rgba(194,72,58,.5)}
  button.ctl:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

  button.ctl.step{padding:.3rem .5rem;line-height:1;font-size:.62rem}
  #dateChip{
    font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;
    color:var(--gold);min-width:6.4rem;
  }
  .toggle{display:inline-flex;align-items:center;gap:.32rem;cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--gold);width:.85rem;height:.85rem}
  .toggle span{font-size:.68rem;color:var(--ink-dim)}

  .hint{font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;color:#5C6A78}
  .credit{
    font-family:var(--mono);font-size:.5rem;letter-spacing:.08em;
    color:#46535F;margin-left:auto;text-align:right;
  }
  .credit a{color:#5E6E7C;text-decoration:none;border-bottom:1px solid rgba(94,110,124,.35)}
  .credit a:hover{color:var(--gold);border-color:var(--gold)}
  .credit a:focus-visible{outline:1px solid var(--gold);outline-offset:2px}

  @media (max-width:720px){
    #caption{max-width:min(15rem,64vw);padding:.35rem .5rem;top:.4rem;left:.4rem}
    #caption .head{font-size:.8rem;margin-bottom:0}
    #caption .sub{font-size:.5rem;margin-bottom:.15rem}
    #caption .note{display:none}
    #readout{
      right:.4rem;top:.4rem;font-size:.54rem;min-width:0;padding:.35rem .45rem;
      max-height:42%;overflow:hidden;
    }
    #readout .date{font-size:.56rem;margin-bottom:.25rem}
    #readout dl{gap:.1rem .45rem}
    #verdict{bottom:.4rem;font-size:.66rem;left:.4rem;right:.4rem;transform:none;text-align:center;padding:.3rem .4rem}
    h1{font-size:.9rem;letter-spacing:.1em}
    .romaji{display:none}
    .hint{display:none}
    .rail{gap:.4rem}
    #dateChip{min-width:0;font-size:.56rem}
    footer{padding:.4rem .5rem .5rem}
    .credit{font-size:.45rem;width:100%;text-align:left;margin-left:0}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>合を立体で見る</h1>
    <span class="romaji">conjunction in depth</span>
    <div class="scenes" role="tablist" id="sceneTabs"></div>
  </header>

  <div id="stage">
    <canvas id="sky"></canvas>

    <div class="plate" id="caption">
      <div class="sub" id="capSub"></div>
      <div class="head" id="capHead"></div>
      <div class="note" id="capNote"></div>
    </div>

    <div class="plate" id="readout">
      <div class="date" id="roDate"></div>
      <dl id="roList"></dl>
    </div>

    <div class="plate" id="verdict"></div>
  </div>

  <footer>
    <div class="rail">
      <label for="timeSlider" id="dateChip">日付</label>
      <button class="ctl step" id="prevBtn" aria-label="前のコマ">◀</button>
      <div class="track-wrap">
        <input type="range" id="timeSlider" min="0" max="10" value="0" step="1">
        <div class="marks" id="marks"></div>
      </div>
      <button class="ctl step" id="nextBtn" aria-label="次のコマ">▶</button>
      <button class="ctl" id="playBtn" aria-pressed="false">▶ 再生</button>
    </div>
    <div class="rail">
      <label for="scaleSlider">奥行き</label>
      <input type="range" id="scaleSlider" min="0" max="100" value="62" step="1">
      <label for="zoomSlider">望遠</label>
      <input type="range" id="zoomSlider" min="0" max="100" value="0" step="1">
    </div>
    <div class="rail">
      <button class="ctl" id="earthBtn">地球からの見え方</button>
      <button class="ctl" id="sideBtn">横から見る</button>
      <button class="ctl" id="unitBtn">AU で表示</button>
      <button class="ctl" id="plateBtn" aria-pressed="false">数値を隠す</button>
      <label class="toggle"><input type="checkbox" id="allBodies"><span>他の惑星</span></label>
      <label class="toggle"><input type="checkbox" id="showZodiac" checked><span>黄道十二宮</span></label>
      <span class="hint">ドラッグで回転／ホイールで望遠</span>
      <span class="credit">
        Positions: <a href="https://github.com/cosinekitty/astronomy" target="_blank" rel="noopener">Astronomy Engine</a> (MIT) — VSOP87 / NOVAS
      </span>
    </div>
  </footer>
</div>

function radiusMap(r, rmax){
  const real = REACH * (r / rmax);
  const r0 = 0.0015;
  const log = REACH * Math.log(1 + r/r0) / Math.log(1 + rmax/r0);
  return real*(1-S.scaleT) + log*S.scaleT;
}

function camDistance(){

  return 2.2*(1-a)+0.05*a;
}

  const upRef=[0,0,1];

  if(len(right)<1e-6) right=cross(fwd,[0,1,0]);

  const up=norm(cross(right,fwd));
  return {pos,fwd,right,up};
}

const fovDeg = ()=>2*Math.atan(1/focal())*180/Math.PI;

function project(P){
  const rel=sub(P,CAM.pos);
  const d=dot(rel,CAM.fwd);
  if(d<=0.02) return null;
  const k=(Math.min(W,H)/2)*focal()/d;
  return {x:W/2+dot(rel,CAM.right)*k, y:H/2-dot(rel,CAM.up)*k, d};
}

function lookFromEarth(){
  const d=S.earthDir;
  const e=scale(d,-1);                       // 地球の手前にカメラを置く
  setTarget(Math.atan2(e[1],e[0]), Math.asin(Math.max(-1,Math.min(1,e[2]))));
}
function lookFromSide(){
  const d=S.earthDir;
  const e=scale(d,-1);
  setTarget(Math.atan2(e[1],e[0])+Math.PI/2, 0.30);
}
function setTarget(y,p){
  S.tYaw=y; S.tPitch=Math.max(-1.53,Math.min(1.53,p));
  while(S.tYaw-S.yaw>Math.PI) S.tYaw-=2*Math.PI;
  while(S.tYaw-S.yaw<-Math.PI) S.tYaw+=2*Math.PI;
  if(reduceMotion){ S.yaw=S.tYaw; S.pitch=S.tPitch; S.easing=false; }
  else S.easing=true;
}
function ease(){
  if(!S.easing) return;
  S.yaw += (S.tYaw-S.yaw)*0.12;
  S.pitch += (S.tPitch-S.pitch)*0.12;
  if(Math.abs(S.tYaw-S.yaw)<2e-4 && Math.abs(S.tPitch-S.pitch)<2e-4){
    S.yaw=S.tYaw; S.pitch=S.tPitch; S.easing=false;
  }
}
/** 今どれくらい「地球視点」に近いか（0〜1） */
function earthAlignment(){
  const cp=Math.cos(S.pitch);
  const e=[cp*Math.cos(S.yaw), cp*Math.sin(S.yaw), Math.sin(S.pitch)];
  const c=-dot(e,S.earthDir);
  return Math.max(0,(c-0.94)/0.06);
}

/* ============================================================
   描画
   ============================================================ */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=stage.clientWidth; H=stage.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function seg(a,b,color,width,dash){
  const A=project(a), B=project(b);
  if(!A||!B) return;
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width;
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  ctx.restore();
}

function drawZodiac(){
  if(!S.showZodiac) return;
  // 黄道環
  ctx.strokeStyle="rgba(201,174,116,.30)"; ctx.lineWidth=1;
  ctx.beginPath();
  let started=false;
  for(let i=0;i<=144;i++){
    const a=i/144*Math.PI*2;
    const p=project([Math.cos(a)*RING,Math.sin(a)*RING,0]);
    if(!p){started=false;continue}
    if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();
  // 宮の境界と符号
  for(let s=0;s<12;s++){
    const a=s*Math.PI/6;
    seg([Math.cos(a)*RING*0.985,Math.sin(a)*RING*0.985,0],
        [Math.cos(a)*RING*1.045,Math.sin(a)*RING*1.045,0],
        "rgba(201,174,116,.42)",1);
    seg([0,0,0],[Math.cos(a)*RING,Math.sin(a)*RING,0],"rgba(78,122,150,.10)",1);
    const m=(s+0.5)*Math.PI/6;
    const p=project([Math.cos(m)*RING*1.10,Math.sin(m)*RING*1.10,0]);
    if(p){
      ctx.fillStyle="rgba(201,174,116,.62)";
      ctx.font="13px "+F_MIN;
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(SIGNS[s],p.x,p.y);
    }
  }
  // 黄道面のうっすらした同心円
  for(const rr of [0.33,0.66]){
    ctx.strokeStyle="rgba(78,122,150,.13)"; ctx.lineWidth=1;
    ctx.beginPath(); started=false;
    for(let i=0;i<=96;i++){
      const a=i/96*Math.PI*2;
      const p=project([Math.cos(a)*RING*rr,Math.sin(a)*RING*rr,0]);
      if(!p){started=false;continue}
      if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
}

function drawEarth(){
  const p=project([0,0,0]);
  if(!p) return;
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,16);
  g.addColorStop(0,"rgba(120,180,210,.55)"); g.addColorStop(1,"rgba(120,180,210,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,16,0,7); ctx.fill();
  ctx.fillStyle="#8FC3DC"; ctx.beginPath(); ctx.arc(p.x,p.y,3.4,0,7); ctx.fill();
  ctx.fillStyle="rgba(230,220,198,.62)";
  ctx.font="10px "+F_GO;
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText("地球",p.x+8,p.y+9);
}

function drawBody(key, v, isFocus){
  const b=BODY[key];
  const r=len(v), u=norm(v);
  const rr=radiusMap(r,RMAX);
  const P=scale(u,rr);
  const onRing=scale(u,RING);
  const flat=[P[0],P[1],0];

  // 視線：地球から天体へ、さらに黄道環まで延長
  seg([0,0,0],P, isFocus?"rgba(194,72,58,.85)":"rgba(201,174,116,.28)", isFocus?1.4:1);
  seg(P,onRing, isFocus?"rgba(194,72,58,.28)":"rgba(201,174,116,.12)", 1, [3,4]);
  // 黄緯を示す垂線
  seg(P,flat,"rgba(78,122,150,.45)",1,[2,3]);

  const p=project(P);
  if(!p) return;
  const rad=b.r*(isFocus?1.15:0.85);
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,rad*3.4);
  g.addColorStop(0,b.color+"88"); g.addColorStop(1,b.color+"00");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rad*3.4,0,7); ctx.fill();
  ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(p.x,p.y,rad,0,7); ctx.fill();

  ctx.font=(isFocus?"15px ":"12px ")+F_MIN;
  ctx.fillStyle=isFocus?"#E6DCC6":"rgba(230,220,198,.66)";
  ctx.textAlign="left"; ctx.textBaseline="middle";
  ctx.fillText(b.glyph, p.x+rad+5, p.y-6);
  if(isFocus){
    ctx.font="10px "+F_MO;
    ctx.fillStyle="rgba(230,220,198,.55)";
    ctx.fillText(fmtAU(r), p.x+rad+5, p.y+7);
  }
  // 黄道環に落ちる黄経の位置＝ホロスコープに書かれる点
  const q=project(onRing);
  if(q){
    ctx.fillStyle=isFocus?"rgba(194,72,58,.9)":"rgba(201,174,116,.45)";
    ctx.beginPath(); ctx.arc(q.x,q.y,isFocus?2.6:1.8,0,7); ctx.fill();
  }
}

function render(){
  ease();
  CAM=camBasis();
  ctx.clearRect(0,0,W,H);
  // 背景のわずかな明暗
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.72);
  bg.addColorStop(0,"#12202E"); bg.addColorStop(1,"#0C1622");
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const sc=scene(), f=sc.frames[S.frame], keys=visibleKeys();
  drawZodiac();

  const others=keys.filter(k=>!sc.pair.includes(k));
  // 遠いものから描く
  const order=[...others,...sc.pair].sort((a,b)=>{
    const pa=project(scale(norm(f[a]),radiusMap(len(f[a]),RMAX)));
    const pb=project(scale(norm(f[b]),radiusMap(len(f[b]),RMAX)));
    return (pb?pb.d:0)-(pa?pa.d:0);
  });
  for(const k of order) drawBody(k,f[k],sc.pair.includes(k));
  drawEarth();
  requestAnimationFrame(render);
}

/* ============================================================
   数値の表示
   ============================================================ */
function fmtAU(r){
  // 0.01AU未満は倍率でも AU でも桁が潰れるので km に落とす
  if(r<0.01) return (r*AU_KM/10000).toFixed(1).replace(/\.0$/,"")+"万km";
  return S.unit==="au" ? r.toFixed(3)+" AU" : r.toFixed(2)+"倍";
}
function angleBetween(a,b){
  return Math.acos(Math.max(-1,Math.min(1,dot(norm(a),norm(b)))))*180/Math.PI;
}
function eclLon(v){ let d=Math.atan2(v[1],v[0])*180/Math.PI; return (d+360)%360; }
function eclLat(v){ return Math.asin(v[2]/len(v))*180/Math.PI; }
function signOf(lon){ return SIGNS[Math.floor(lon/30)%12]+" "+(lon%30).toFixed(2)+"°"; }
function jst(iso){
  const d=new Date(iso);
  const j=new Date(d.getTime()+9*3600*1000);
  const p=n=>String(n).padStart(2,"0");
  return `${j.getUTCFullYear()}.${p(j.getUTCMonth()+1)}.${p(j.getUTCDate())} ${p(j.getUTCHours())}:${p(j.getUTCMinutes())} JST`;
}

/** コマ送りの刻みが1日未満なら時刻まで見せる */
function shortDate(sc,i){
  const d=new Date(new Date(sc.times[i]).getTime()+9*3600*1000);
  const p=n=>String(n).padStart(2,"0");
  const fine=sc.times.length>1 &&
    Math.abs(new Date(sc.times[1])-new Date(sc.times[0]))<24*3600*1000;
  const base=`${d.getUTCFullYear()}.${p(d.getUTCMonth()+1)}.${p(d.getUTCDate())}`;
  return fine ? `${base} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}` : base;
}

function updateReadout(){
  const sc=scene(), f=sc.frames[S.frame];
  const [k1,k2]=sc.pair, v1=f[k1], v2=f[k2];
  const r1=len(v1), r2=len(v2);
  const sep=angleBetween(v1,v2);
  const dLon=Math.abs(((eclLon(v1)-eclLon(v2)+540)%360)-180);
  const dLat=Math.abs(eclLat(v1)-eclLat(v2));

  document.getElementById("roDate").textContent=jst(sc.times[S.frame]);
  document.getElementById("dateChip").textContent=shortDate(sc,S.frame);
  document.getElementById("roList").innerHTML=`
    <dt>離角</dt><dd class="big">${sep.toFixed(2)}°</dd>
    <dt>黄経差</dt><dd>${dLon.toFixed(2)}°</dd>
    <dt>黄緯差</dt><dd>${dLat.toFixed(2)}°</dd>
    <div class="rule"></div>
    <dt class="cap">距離</dt><dd class="cap">${S.unit==="au"?"AU":"地球〜太陽=1"}</dd>
    <dt>${BODY[k1].glyph} ${BODY[k1].name}</dt><dd>${fmtAU(r1)}</dd>
    <dt>${BODY[k2].glyph} ${BODY[k2].name}</dt><dd>${fmtAU(r2)}</dd>
    <dt>奥行きの差</dt><dd class="big">${fmtAU(Math.abs(r1-r2))}</dd>
    <div class="rule"></div>
    <dt>${BODY[k1].glyph} 黄経</dt><dd>${signOf(eclLon(v1))}</dd>
    <dt>${BODY[k2].glyph} 黄経</dt><dd>${signOf(eclLon(v2))}</dd>
    ${sc.showElement?`<dt>エレメント</dt><dd>${SIGN_NAMES[Math.floor(eclLon(v1)/30)%12]}・${ELEM[Math.floor(eclLon(v1)/30)%4]}</dd>`:""}
    <div class="rule"></div>
    <dt>視野</dt><dd>${fovDeg()<1?fovDeg().toFixed(2):fovDeg().toFixed(1)}°</dd>`;

  // 視線の中心方向＝地球視点の基準
  S.earthDir=norm([norm(v1)[0]+norm(v2)[0], norm(v1)[1]+norm(v2)[1], norm(v1)[2]+norm(v2)[2]]);

  const el=document.getElementById("verdict");
  const a=earthAlignment();
  const gap=Math.abs(r1-r2);
  el.style.opacity=1;
  if(a>0.5){
    el.innerHTML = sep<1.5
      ? (S.zoom<6 ? `地球からは <b>ひとつ</b> に見える　—　望遠で覗くと分かれる`
                  : `望遠でようやく二つになる。離角 <b>${sep.toFixed(2)}°</b>`)
      : `黄経は <b>${dLon.toFixed(2)}°</b> 差。黄緯が <b>${dLat.toFixed(1)}°</b> ずれている`;
  }else{
    el.innerHTML = dLon<3
      ? `黄経は重なり、奥行きは <b>${fmtAU(gap)}</b> 離れている`
      : `黄経差 <b>${dLon.toFixed(1)}°</b>、奥行きの差 <b>${fmtAU(gap)}</b>`;
  }
}

/* ============================================================
   場面の切り替えとUI
   ============================================================ */
const slider=document.getElementById("timeSlider");

function setScene(i,keepFrame){
  S.scene=i;
  const sc=scene();
  RMAX=rmaxOf();
  slider.max=sc.frames.length-1;
  if(!keepFrame) S.frame=sc.defaultFrame;
  slider.value=S.frame;
  // 場面ごとに見やすい奥行きの既定値（土星と月を同じ縮尺では扱えない）
  S.scaleT=sc.scaleT;
  document.getElementById("scaleSlider").value=Math.round(sc.scaleT*100);
  renderMarks(sc);
  document.getElementById("capSub").textContent=sc.subtitle;
  document.getElementById("capHead").textContent=sc.title;
  document.getElementById("capNote").textContent=sc.note;
  [...document.querySelectorAll(".scene-tab")].forEach((b,k)=>
    b.setAttribute("aria-selected", k===i?"true":"false"));
  updateReadout();
  setZoom(1);
  // 開幕：まず重なった姿を見せ、ひと呼吸おいて回り込む
  S.easing=false;
  const d=S.earthDir, e=scale(d,-1);
  S.yaw=S.tYaw=Math.atan2(e[1],e[0]);
  S.pitch=S.tPitch=Math.asin(Math.max(-1,Math.min(1,e[2])));
  clearTimeout(revealTimer);
  revealTimer=setTimeout(lookFromSide, reduceMotion?0:900);
}
let revealTimer=null;

function renderMarks(sc){
  const box=document.getElementById("marks");
  box.innerHTML="";
  const n=sc.frames.length-1;
  for(const m of sc.marks){
    const b=document.createElement("button");
    b.type="button"; b.textContent=m.label;
    const pct=n?m.frame/n*100:0;
    b.style.left=`calc(${pct}% + ${(0.5-pct/100)*11}px)`;
    b.onclick=()=>{ stop(); S.frame=m.frame; slider.value=m.frame; updateReadout(); lookFromEarth(); };
    box.appendChild(b);
  }
}

EPHEM.scenes.forEach((sc,i)=>{
  const b=document.createElement("button");
  b.className="scene-tab"; b.type="button"; b.role="tab";
  b.textContent=sc.title;
  b.onclick=()=>{stop();setScene(i)};
  document.getElementById("sceneTabs").appendChild(b);
});

slider.addEventListener("input",()=>{ S.frame=+slider.value; updateReadout(); });
document.getElementById("scaleSlider").addEventListener("input",e=>{ S.scaleT=+e.target.value/100; });
const zoomSlider=document.getElementById("zoomSlider");
function setZoom(z, fromSlider){
  S.zoom=Math.max(1,Math.min(40,z));
  if(!fromSlider) zoomSlider.value=Math.round(Math.log(S.zoom)/Math.log(40)*100);
}
zoomSlider.addEventListener("input",e=>setZoom(Math.pow(40,e.target.value/100),true));
const unitBtn=document.getElementById("unitBtn");
unitBtn.onclick=()=>{
  S.unit = S.unit==="au" ? "ratio" : "au";
  unitBtn.textContent = S.unit==="au" ? "倍率で表示" : "AU で表示";
  updateReadout();
};
const plateBtn=document.getElementById("plateBtn");
plateBtn.onclick=()=>{
  const off=stage.classList.toggle("plates-off");
  plateBtn.textContent=off?"数値を出す":"数値を隠す";
  plateBtn.setAttribute("aria-pressed",off?"true":"false");
};
document.getElementById("earthBtn").onclick=()=>lookFromEarth();
document.getElementById("sideBtn").onclick=()=>lookFromSide();
document.getElementById("allBodies").onchange=e=>{ S.showAll=e.target.checked; RMAX=rmaxOf(); };
document.getElementById("showZodiac").onchange=e=>{ S.showZodiac=e.target.checked; };

function stepFrame(dir){
  stop();
  const n=scene().frames.length;
  S.frame=(S.frame+dir+n)%n;
  slider.value=S.frame; updateReadout();
}
document.getElementById("prevBtn").onclick=()=>stepFrame(-1);
document.getElementById("nextBtn").onclick=()=>stepFrame(1);

let timer=null;
const playBtn=document.getElementById("playBtn");
function stop(){ if(timer)clearInterval(timer); timer=null; S.playing=false;
  playBtn.textContent="▶ 再生"; playBtn.setAttribute("aria-pressed","false"); }
playBtn.onclick=()=>{
  if(S.playing) return stop();
  S.playing=true; playBtn.textContent="■ 停止"; playBtn.setAttribute("aria-pressed","true");
  timer=setInterval(()=>{
    S.frame=(S.frame+1)%scene().frames.length;
    slider.value=S.frame; updateReadout();
  },140);
};

/* ---------- 回転・拡大 ---------- */
let drag=null;
stage.addEventListener("pointerdown",e=>{
  drag={x:e.clientX,y:e.clientY}; S.easing=false;
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!drag) return;
  S.yaw -= (e.clientX-drag.x)*0.006;
  S.pitch = Math.max(-1.53,Math.min(1.53,S.pitch+(e.clientY-drag.y)*0.006));
  drag={x:e.clientX,y:e.clientY};
});
["pointerup","pointercancel"].forEach(ev=>stage.addEventListener(ev,()=>{
  drag=null; stage.classList.remove("dragging");
}));
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  setZoom(S.zoom*(1-Math.sign(e.deltaY)*0.12));
},{passive:false});
let pinch=null;
stage.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                     e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
stage.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinch){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
                       e.touches[0].clientY-e.touches[1].clientY);
    setZoom(S.zoom*(d/pinch));
    pinch=d; drag=null;
  }
},{passive:true});
stage.addEventListener("touchend",()=>{pinch=null},{passive:true});

addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
    const n=scene().frames.length;
    S.frame=(S.frame+(e.key==="ArrowRight"?1:n-1))%n;
    slider.value=S.frame; updateReadout();
  }
});

addEventListener("resize",resize);
resize();
setScene(0);
requestAnimationFrame(render);
setInterval(updateReadout, 250);   // 視点に応じた文言の更新
</script>
</body>
